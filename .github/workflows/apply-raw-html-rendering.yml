name: Apply raw HTML rendering

on:
  push:
    branches: [agent/raw-html-rendering]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/raw-html-rendering
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply patch
        run: python scripts/apply-raw-html-patch.py
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit implementation
        run: |
          rm scripts/apply-raw-html-patch.py
          rm .github/workflows/apply-raw-html-rendering.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src scripts .github
          git commit -m "Support trusted raw HTML rendering"
          git push
